[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclash"
version = "0.1.0"
description = "Automatización de Clash of Clans sobre Google Play Games"
requires-python = ">=3.11"
dependencies = ["Pillow", "numpy", "opencv-python-headless", "rapidfuzz"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]
ui = ["PySide6"]
record = ["pynput"]
ocr =["easyocr"]
secrets = ["keyring"]  # almacén de credenciales del sistema; sin él las claves van a un fichero restringido

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyclash = ["data/*.json", "assets/fonts/*.ttf", "assets/troops/*.png", "assets/icons/*.png", "assets/resources/*.png","assets/screens/*.png","assets/level_badges/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
