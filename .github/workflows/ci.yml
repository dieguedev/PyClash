name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Comprobar fixtures anonimizados
        run: python tools/check_fixtures.py
      - name: Tests
        run: python -m pytest -v
